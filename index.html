<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Task Cloud App</title>
</head>

<body>

<h1>📋 Task Cloud</h1>

<input id="taskInput" placeholder="Nova tarefa">
<button onclick="addTask()">Adicionar</button>

<ul id="list"></ul>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 🔧 CONFIG DO FIREBASE (você vai pegar no console)
  const firebaseConfig = {
    apiKey: "SUA_API_KEY",
    authDomain: "SEU_PROJETO.firebaseapp.com",
    projectId: "SEU_PROJETO",
    storageBucket: "SEU_PROJETO.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const tasksRef = collection(db, "tasks");

  // 📥 Ler tarefas em tempo real
  onSnapshot(tasksRef, (snapshot) => {
    let list = document.getElementById("list");
    list.innerHTML = "";

    snapshot.forEach((docItem) => {
      let li = document.createElement("li");
      li.textContent = docItem.data().text;

      let btn = document.createElement("button");
      btn.textContent = "❌";

      btn.onclick = async () => {
        await deleteDoc(doc(db, "tasks", docItem.id));
      };

      li.appendChild(btn);
      list.appendChild(li);
    });
  });

  // ➕ adicionar tarefa
  window.addTask = async function () {
    let input = document.getElementById("taskInput");

    if (!input.value.trim()) return;

    await addDoc(tasksRef, {
      text: input.value
    });

    input.value = "";
  };
</script>

</body>
</html>
